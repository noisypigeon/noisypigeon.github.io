<!DOCTYPE html>
<html lang="en-US" dir="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines | truncate: 300 }}">

  <link rel="icon" href="{{ '/assets/images/site/avatar.png' | relative_url }}" type="image/png">
  <link rel="apple-touch-icon" href="{{ '/assets/images/site/avatar.png' | relative_url }}">

  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_html | strip_newlines | truncate: 300 }}">
  <meta property="og:image" content="{{ '/assets/images/site/social_preview.png' | absolute_url }}">

  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}" />

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" crossorigin="anonymous">

  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
  <link rel="stylesheet" href="https://fonts.bunny.net/css?family=ibm-plex-sans:400,400i,500,500i,600,600i,700,700i&display=swap">

  <meta name="theme-color" media="(prefers-color-scheme: light)" content="rgb(228, 233, 226)">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="rgb(25, 28, 26)">
</head>
<body class="site-view {% if page.layout == 'home' %}site-page-body site-home-page{% elsif page.layout == 'page' %}site-page-body{% elsif page.layout == 'post' %}site-post-body{% endif %} color-theme-gameboy font-theme-ibm-plex">
  <a class="skip-link" href="#main">Skip to content</a>

  {% include header.html %}

  <main id="main" class="site-main">
    {{ content }}
  </main>

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js" crossorigin="anonymous"
    onload="renderMathInElement(document.body, {delimiters: [
      {left: '$$', right: '$$', display: true},
      {left: '$', right: '$', display: false}
    ]});"></script>
</body>
</html>
